name: Checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Check formatting
        run: npx prettier --check .

      - name: Type-check
        run: npx astro check

      - name: Build
        run: npm run build

      - name: Check CSP hashes
        run: npm run check:csp

      # Offline: checks internal links and assets in the built site only, so
      # external sites being down can't fail a PR. Extensionless links like
      # /about resolve to about.html, matching build.format: 'file'.
      - name: Check links
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: >-
            --offline
            --no-progress
            --root-dir ${{ github.workspace }}/dist
            --fallback-extensions html
            --index-files index.html
            --include-fragments
            'dist/**/*.html'
          fail: true
